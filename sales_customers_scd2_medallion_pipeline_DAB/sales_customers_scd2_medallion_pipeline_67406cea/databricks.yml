# Declarative Automation Bundle (DAB) for the Sales Customers SCD2 Medallion Pipeline
# Deploy with: databricks bundle deploy -t dev  (or -t prod)

bundle:
  name: sales_customers_scd2_medallion

include:
  - src/variables.yml
  - src/env/*.yml
  - resources/pipelines/*.yml
  # - resources/catalogs/*.yml  # Catalog created manually via UI
  - resources/schemas/*.yml
  - resources/volumes/*.yml
  
targets:
  dev:
    mode: development
    default: true
    variables:
      environment: dev
      schema: default
      catalog: dev
      #catalog_storage_root: s3://dbstorage-prod-jctgz/uc/a966cfdf-7d1f-452e-b8dd-b8902830ce4f/f81719ac-4c77-4a42-ae8e-b444cf451f92/dev

  prod:
    mode: production
    variables:
      environment: prod
      source_table: prod.sales_customers
      catalog: prod
      #catalog_storage_root: s3://dbstorage-prod-jctgz/uc/a966cfdf-7d1f-452e-b8dd-b8902830ce4f/f81719ac-4c77-4a42-ae8e-b444cf451f92/prod
      schema: default
      
    workspace:
      root_path: /Workspace/Production/.bundle/${bundle.name}
    run_as:
      user_name: ${workspace.current_user.userName}